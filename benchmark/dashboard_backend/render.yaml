services:
  - type: web
    name: act-aware-benchmark-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://act-aware-benchmark.vercel.app
    autoDeploy: true
